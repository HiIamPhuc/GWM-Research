# Head-centered world-state Transformer with shared inverse relations
struct_emb_dim: 256
num_next_state_slots: 3
router_secondary_logit: -3.0
context_encoder_heads: 4
context_encoder_ffn_multiplier: 2
context_encoder_dropout: 0.1
context_encoder_layers: 1
transition_decoder_heads: 8
transition_decoder_ffn_multiplier: 8
transition_decoder_dropout: 0.1
transition_decoder_layers: 3
temperature: 0.07
state_reconstruction_ratio: 0.05
state_reconstruction_weight: 0.1

learning_rate: 0.005
weight_decay: 0.01
min_lr: 0.001
warmup_ratio: 0.05
grad_clip_norm: 1.0
num_epochs: 200
early_stopping_patience: 15

batch_size: 2048
eval_batch_size: 2048
candidate_batch_size: 2048
gradient_accumulation_steps: 1

data_dir: data-processed/wn18rr
output_dir: output/wn18rr-context-memory-transformer
seed: 42
