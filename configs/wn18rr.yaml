# Config for context-aware GWM with precomputed text embeddings
text_embedding_dim: 384
structural_dim: 384

fusion_dim: 768
fusion_mode: gated

compgcn_dim: 768
compgcn_layers: 1
compgcn_op: mult

dynamics_dim: 768
dynamics_layers: 2
h0c0_dim: 768

dropout: 0.1
recurrent_dropout: 0.1

learning_rate: 5e-4
weight_decay: 0.01
min_lr: 1e-5
warmup_ratio: 0.1
grad_clip_norm: 1.0
num_epochs: 400
early_stopping_patience: 15
eval_every: 1

batch_size: 2048
eval_batch_size: 2048
candidate_batch_size: 2048

loss: infonce
temperature: 0.07

data_dir: data-processed/wn18rr
output_dir: output/wn18rr
    
add_inverse: true
context_k: 5
context_agg: mean
    
device: cuda
seed: 42

text_cache_device: cpu