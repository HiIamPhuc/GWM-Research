# Structural-only PairRE-conditioned graph world model
struct_emb_dim: 128
transition_decoder_heads: 4
transition_decoder_ffn_multiplier: 2
transition_decoder_dropout: 0.1
transition_decoder_layers: 2
temperature: 0.07

learning_rate: 0.00005
weight_decay: 0.01
min_lr: 0.000001
warmup_ratio: 0.1
grad_clip_norm: 1.0
num_epochs: 200
early_stopping_patience: 10

batch_size: 512
eval_batch_size: 512
candidate_batch_size: 512
gradient_accumulation_steps: 1

data_dir: data-processed/umls
output_dir: output/umls-structural-pairre
seed: 42
