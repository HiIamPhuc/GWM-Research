# Config for context-aware GWM with precomputed text embeddings
text_embedding_dim: 768
text_adapter_dim: 768
structural_dim: 384
struct_adapter_dim: 384
adapter_dropout: 0.1

text_compgcn_dim: 768
struct_compgcn_dim: 384
compgcn_layers: 1
compgcn_op: mult

text_dynamics_dim: 768
struct_dynamics_dim: 384
dynamics_layers: 1

dropout: 0.1
recurrent_dropout: 0.1
alpha_relation_only: true

learning_rate: 5e-5
weight_decay: 0.001
min_lr: 1e-5
warmup_ratio: 0.1
grad_clip_norm: 1.0
num_epochs: 1000
early_stopping_patience: 15
eval_every: 1

batch_size: 2048
eval_batch_size: 2048
candidate_batch_size: 2048

loss: infonce
temperature: 0.07
per_relation_temperature: true
hard_negative_k: 0
hard_negative_fraction: 0.1
hard_negative_weight: 3.0

use_multi_loss: true
use_pcgrad: true
learnable_loss_weights: true
loss_weights: [1.0, 1.0, 1.0]

data_dir: data-processed/wn18rr
output_dir: output/wn18rr
    
add_inverse: true
context_k: 5
context_agg: mean
    
device: cuda
seed: 42

text_cache_device: cpu

save_eval_predictions: true
eval_topk: 10
eval_predictions_dir: output/wn18rr/predictions