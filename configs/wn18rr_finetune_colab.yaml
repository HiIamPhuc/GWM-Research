# Config for GWM-RNN-Text
pretrained_model: bert-base-uncased
num_layers: 2
hidden_dim: 1024
structural_dim: 384
fusion_mode: gated
dropout: 0.2
learning_rate: 1e-4
batch_size: 56
loss: infonce
num_epochs: 200
temperature: 0.07

data_dir: data-processed/wn18rr
output_dir: output/wn18rr_bert_finetune
    
add_inverse: true
context_k: 5
context_agg: mean
early_stopping: 5
eval_every: 1
    
device: cuda
seed: 42

eval_batch_size: 56
candidate_batch_size: 56