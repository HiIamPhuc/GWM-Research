# Context-free structural two-token Transformer
struct_emb_dim: 384
transformer_layers: 1
transformer_heads: 4
transformer_ffn_multiplier: 2
transformer_dropout: 0.1
temperature: 0.07

learning_rate: 5e-4
weight_decay: 0.0001
min_lr: 1e-5
warmup_ratio: 0.1
grad_clip_norm: 1.0
num_epochs: 500
early_stopping_patience: 15
eval_every: 1

batch_size: 2048
eval_batch_size: 1024
candidate_batch_size: 2048

data_dir: data-processed/nell-995
output_dir: output/nell-995-two-token-transformer
add_inverse: true
seed: 42

save_eval_predictions: true
eval_topk: 10
eval_predictions_dir: output/nell-995-two-token-transformer/predictions
