# Config for context-aware GWM with precomputed text embeddings
text_emb_dim: 768
struct_emb_dim: 384

text_adapter_dim: 768
struct_adapter_dim: 384

dynamics_layers: 2

adapter_dropout: 0.1
dropout: 0.2

learning_rate: 5e-4
weight_decay: 0.0001
min_lr: 1e-5
warmup_ratio: 0.1
grad_clip_norm: 1.0
num_epochs: 500
early_stopping_patience: 15
eval_every: 1

batch_size: 2048
eval_batch_size: 2048
candidate_batch_size: 2048

temperature: 0.07
struct_loss_type: self_adversarial
struct_adv_temperature: 1.0
struct_adv_detach_weights: true
balance_floor: 0.1
alpha_target: 0.8
alpha_prior_weight: 0.3
alpha_entropy_weight: 0.1
alpha_entropy_min: 0.5

data_dir: data-processed/wn18rr
output_dir: output/wn18rr
    
add_inverse: true
context_k: 5
context_agg: mean
    
device: cuda
seed: 42

save_eval_predictions: true
eval_topk: 10
eval_predictions_dir: output/wn18rr/predictions