# Config for GWM-RNN-Text (FB15k-237)
pretrained_model: sentence-transformers/all-MiniLM-L6-v2
dynamics_layers: 2
num_layers: 2
hidden_dim: 768
structural_dim: 384
fusion_mode: gated
dropout: 0.2
recurrent_dropout: 0.2
loss: infonce
temperature: 0.07
compgcn_layers: 2
compgcn_op: mult

num_epochs: 400
learning_rate: 5e-4
text_encoder_lr: 1e-4
weight_decay: 0.01
use_scheduler: true
warmup_ratio: 0.1
max_grad_norm: 1.0
batch_size: 88
early_stopping_patience: 7
eval_every: 1
eval_batch_size: 88
candidate_batch_size: 88
device: cuda
seed: 42
gate_alpha_min: 0.05
gate_alpha_max: 0.95

data_dir: data-processed/fb15k-237
output_dir: output/fb15k-237

add_inverse: true
context_k: 15
context_algorithm: random
context_batch_size: 256
context_mmr_lambda: 0.5

max_length: 512