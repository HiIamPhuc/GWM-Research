# Config for GWM-RNN-Text
pretrained_model: bert-base-uncased
num_layers: 2
hidden_dim: 1024
structural_dim: 384
fusion_mode: gated
dropout: 0.2
loss: infonce
temperature: 0.07

num_epochs: 400
learning_rate: 1e-4
batch_size: 80
early_stopping: 7
eval_every: 1
eval_batch_size: 80
candidate_batch_size: 80
device: cuda
seed: 42

data_dir: data-processed/wn18rr
output_dir: output/wn18rr_bert_finetune
    
add_inverse: true
context_k: 5
context_algorithm: random
context_batch_size: 256
context_mmr_lambda: 0.5