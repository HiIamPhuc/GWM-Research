# Config for GWM-RNN-Text
pretrained_model: bert-base-uncased
num_layers: 2
hidden_dim: 1024
structural_dim: 1024
fusion_mode: gated
dropout: 0.1
loss: infonce
temperature: 0.07

learning_rate: 1e-4
text_encoder_lr: 1e-5
weight_decay: 0.01
use_scheduler: true
warmup_ratio: 0.1
max_grad_norm: 1.0
batch_size: 32
num_epochs: 10
early_stopping_patience: 10
eval_every: 1
eval_batch_size: 32
candidate_batch_size: 32
device: cuda
seed: 42
gate_alpha_min: 0.05
gate_alpha_max: 0.95

data_dir: data-processed/wn18rr
output_dir: output/wn18rr_bert_finetune
    
add_inverse: true
context_k: 5
context_algorithm: mmr_neighbor
context_batch_size: 128
context_mmr_lambda: 0.5