# Context-memory Transformer with shared inverse relations
struct_emb_dim: 512
transformer_heads: 4
transformer_ffn_multiplier: 2
transformer_dropout: 0.1
context_encoder_layers: 1
transition_decoder_layers: 2
temperature: 0.07

learning_rate: 1e-3
weight_decay: 0.01
min_lr: 1e-4
warmup_ratio: 0.1
grad_clip_norm: 1.0
num_epochs: 500
early_stopping_patience: 15

batch_size: 2048
eval_batch_size: 2048
candidate_batch_size: 2048

data_dir: data-processed/wn18rr
output_dir: output/wn18rr-context-memory-transformer
seed: 42
