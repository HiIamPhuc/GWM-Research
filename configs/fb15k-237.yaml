# Config for context-aware GWM with precomputed text embeddings
text_embedding_dim: 768
structural_dim: 768
fusion_dim: 1024
compgcn_dim: 1024
compgcn_layers: 1
fusion_mode: gated
dropout: 0.25
recurrent_dropout: 0.1
learning_rate: 1e-4
weight_decay: 0.01
min_lr: 1e-6
warmup_ratio: 0.05
grad_clip_norm: 1.0
batch_size: 1024
loss: infonce
num_epochs: 400
temperature: 0.07

data_dir: data-processed/fb15k-237
output_dir: output/fb15k-237
    
add_inverse: true
context_k: 10
context_agg: mean

early_stopping_patience: 15
eval_every: 1

dynamics_dim: 1024
hyper_mlp_dim: 2048 
    
device: cuda
seed: 42

text_cache_device: cpu

eval_batch_size: 1024
candidate_batch_size: 1024

compgcn_op: mult