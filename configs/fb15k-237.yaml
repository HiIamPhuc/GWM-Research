# Head-centered world-state Transformer with shared inverse relations
struct_emb_dim: 512
num_next_state_slots: 4
router_secondary_logit: -4.0
context_encoder_heads: 4
context_encoder_ffn_multiplier: 2
context_encoder_dropout: 0.05
context_encoder_layers: 1
transition_decoder_heads: 8
transition_decoder_ffn_multiplier: 4
transition_decoder_dropout: 0.05
transition_decoder_layers: 2
temperature: 0.1
state_reconstruction_ratio: 0.2
state_reconstruction_weight: 0.1

learning_rate: 0.005
weight_decay: 0.01
min_lr: 0.001
warmup_ratio: 0.05
grad_clip_norm: 1.0
num_epochs: 200
early_stopping_patience: 7

batch_size: 512
eval_batch_size: 512
candidate_batch_size: 2048
gradient_accumulation_steps: 4

data_dir: data-processed/fb15k-237
output_dir: output/fb15k-237-context-memory-transformer
seed: 42
