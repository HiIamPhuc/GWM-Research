# Config for context-aware GWM with precomputed text embeddings
text_embedding_dim: 768
text_adapter_dim: 768
structural_dim: 896
struct_adapter_dim: 896
adapter_dropout: 0.2

text_compgcn_dim: 768
struct_compgcn_dim: 896
compgcn_layers: 1
compgcn_op: mult

text_dynamics_dim: 768
struct_dynamics_dim: 896
dynamics_layers: 1

dropout: 0.2
recurrent_dropout: 0.1

learning_rate: 1e-5
weight_decay: 0.001
min_lr: 1e-5
warmup_ratio: 0.1
grad_clip_norm: 1.0
num_epochs: 400
early_stopping_patience: 15
eval_every: 1

batch_size: 2048
eval_batch_size: 2048
candidate_batch_size: 2048

loss: infonce
temperature: 0.07

use_multi_loss: true
use_pcgrad: true
learnable_loss_weights: true
loss_weights: [1.0, 1.0, 1.0]

data_dir: data-processed/fb15k-237
output_dir: output/fb15k-237
    
add_inverse: true
context_k: 15
context_agg: mean
    
device: cuda
seed: 42

text_cache_device: cpu

save_eval_predictions: true
eval_topk: 10
eval_predictions_dir: output/fb15k-237/predictions