# Config for context-aware GWM with precomputed text embeddings
text_emb_dim: 768
struct_emb_dim: 384

text_adapter_dim: 768
struct_adapter_dim: 384
adapter_dropout: 0.1

text_compgcn_dim: 768
struct_compgcn_dim: 384
compgcn_layers: 1
compgcn_op: mult

dynamics_layers: 1

dropout: 0.1
recurrent_dropout: 0.2

learning_rate: 5e-5
weight_decay: 0.001
min_lr: 1e-5
warmup_ratio: 0.1
grad_clip_norm: 1.0
num_epochs: 500
early_stopping_patience: 15
eval_every: 1

batch_size: 2048
eval_batch_size: 2048
candidate_batch_size: 2048

temperature: 0.07

loss_type: acl
acl_gamma_pos: 0.0
acl_gamma_neg: 4.0
acl_clip: 0.05
acl_pos_weight: 1.0
acl_neg_weight: 1.0

sigreg_weight: 0.005
sigreg_knots: 10
sigreg_num_proj: 512

data_dir: data-processed/wn18rr
output_dir: output/wn18rr
    
add_inverse: true
context_k: 5
context_agg: mean
    
device: cuda
seed: 42

save_eval_predictions: true
eval_topk: 50
eval_predictions_dir: output/wn18rr/predictions