# Config for context-aware GWM with precomputed text embeddings
text_embedding_dim: 768
structural_dim: 896

text_compgcn_dim: 768
struct_compgcn_dim: 896
compgcn_layers: 1
compgcn_op: mult

text_dynamics_dim: 768
struct_dynamics_dim: 896
dynamics_layers: 2

dropout: 0.2
recurrent_dropout: 0.2

learning_rate: 5e-4
weight_decay: 0.01
min_lr: 1e-5
warmup_ratio: 0.1
grad_clip_norm: 1.0
num_epochs: 400
early_stopping_patience: 15
eval_every: 1
structural_lr_scale: 0.2

batch_size: 2048
eval_batch_size: 2048
candidate_batch_size: 2048

loss: infonce
temperature: 0.07

data_dir: data-processed/fb15k-237
output_dir: output/fb15k-237
freeze_structural_priors: False # or True
    
add_inverse: true
context_k: 15
context_agg: mean
    
device: cuda
seed: 42

text_cache_device: cpu

# LoRA preprocessing (optional, used by utils/preprocess_data.py)
lora_pretrain: true
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: query,value
lora_epochs: 10
lora_lr: 5e-5
lora_mlm_probability: 0.15

save_eval_predictions: true
eval_topk: 10
eval_predictions_dir: output/fb15k-237/predictions