# Config for context-aware GWM with precomputed text embeddings
text_emb_dim: 768
struct_emb_dim: 896

text_adapter_dim: 768
struct_adapter_dim: 896
adapter_dropout: 0.1

text_compgcn_dim: 768
struct_compgcn_dim: 896
compgcn_layers: 1
compgcn_op: mult

dynamics_layers: 2

dropout: 0.2
recurrent_dropout: 0.2

learning_rate: 1e-4
weight_decay: 0.01
min_lr: 1e-5
warmup_ratio: 0.2
grad_clip_norm: 1.0
num_epochs: 500
early_stopping_patience: 15
eval_every: 2

batch_size: 2048
eval_batch_size: 2048
candidate_batch_size: 2048

temperature: 0.07
balance_floor: 0.1
bi_loss_weight: 1.0
fused_loss_weight: 1.0

data_dir: data-processed/fb15k-237
output_dir: output/fb15k-237
    
add_inverse: true
context_k: 15
context_agg: mean
    
device: cuda
seed: 42

save_eval_predictions: true
eval_topk: 50
eval_predictions_dir: output/fb15k-237/predictions