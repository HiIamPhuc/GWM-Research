# Structural LSTM with relation-gated head contextualization
struct_emb_dim: 896
dynamics_layers: 1
temperature: 0.07

learning_rate: 5e-4
weight_decay: 0.0001
min_lr: 1e-5
warmup_ratio: 0.1
grad_clip_norm: 1.0
num_epochs: 500
early_stopping_patience: 7
eval_every: 1

batch_size: 2048
eval_batch_size: 2048
candidate_batch_size: 2048

data_dir: data-processed/fb15k-237
output_dir: output/fb15k-237-relation-gated-context
add_inverse: true
seed: 42

save_eval_predictions: true
eval_topk: 10
eval_predictions_dir: output/fb15k-237-relation-gated-context/predictions
