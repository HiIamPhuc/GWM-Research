# Context-free structural Transformer with shared inverse relations
struct_emb_dim: 512
transformer_layers: 1
transformer_heads: 8
transformer_ffn_multiplier: 4
transformer_dropout: 0.05
temperature: 0.1

learning_rate: 5e-3
weight_decay: 0.01
min_lr: 1e-3
warmup_ratio: 0.05
grad_clip_norm: 1.0
num_epochs: 500
early_stopping_patience: 10
eval_every: 1

batch_size: 2048
eval_batch_size: 2048
candidate_batch_size: 2048

data_dir: data-processed/fb15k-237
output_dir: output/fb15k-237-shared-inverse-transformer
add_inverse: true
seed: 42

save_eval_predictions: false
eval_topk: 10
eval_predictions_dir: output/fb15k-237-shared-inverse-transformer/predictions
