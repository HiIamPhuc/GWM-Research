# Data and outputs
data_dir: data-processed/umls
output_dir: output/umls

# Model
text_emb_dim: 768
struct_emb_dim: 128
fusion_dim: 896
dynamics_layers: 1
dropout: 0.2
temperature: 0.07

# Optimization
learning_rate: 0.00005
min_lr: 0.000001
weight_decay: 0.01
warmup_ratio: 0.1
grad_clip_norm: 1.0
num_epochs: 200
early_stopping_patience: 10

# Runtime
batch_size: 512
eval_batch_size: 512
candidate_batch_size: 512
seed: 42
