# Context-memory Transformer with shared inverse relations
struct_emb_dim: 384
context_encoder_heads: 4
context_encoder_ffn_multiplier: 2
context_encoder_dropout: 0.1
context_encoder_layers: 1
context_active_k: 8
context_selection_temperature: 0.2
transition_decoder_heads: 4
transition_decoder_ffn_multiplier: 2
transition_decoder_dropout: 0.1
transition_decoder_layers: 2
temperature: 0.07
state_reconstruction_ratio: 0.15
state_reconstruction_weight: 0.1

learning_rate: 0.0005
weight_decay: 0.0001
min_lr: 0.00001
warmup_ratio: 0.1
grad_clip_norm: 1.0
num_epochs: 500
early_stopping_patience: 15

batch_size: 2048
eval_batch_size: 1024
candidate_batch_size: 2048

data_dir: data-processed/nell-995
output_dir: output/nell-995-context-memory-transformer
seed: 42
