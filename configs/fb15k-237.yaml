# Config for context-aware GWM with precomputed text embeddings
text_emb_dim: 768
struct_emb_dim: 896

text_adapter_dim: 768
struct_adapter_dim: 896
adapter_dropout: 0.1
dropout: 0.0

dynamics_layers: 1
recurrent_dropout: 0.1

fusion_alpha: 0.3

learning_rate: 5e-5
weight_decay: 0.001
min_lr: 1e-5
warmup_ratio: 0.1
grad_clip_norm: 1.0
num_epochs: 500
early_stopping_patience: 10
eval_every: 1

batch_size: 2048
eval_batch_size: 2048
candidate_batch_size: 2048

temperature: 0.07

multi_step_weight: 0.1
sigreg_weight: 0.005
sigreg_knots: 8
sigreg_num_proj: 512

data_dir: data-processed/fb15k-237
output_dir: output/fb15k-237
    
add_inverse: true
context_k: 5
context_agg: mean
    
device: cuda
seed: 42

text_cache_device: cpu

save_eval_predictions: true
eval_topk: 10
eval_predictions_dir: output/fb15k-237/predictions