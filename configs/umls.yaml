# Structural LSTM with a precomputed mean-composed context state
struct_emb_dim: 128
dynamics_layers: 1
temperature: 0.07

learning_rate: 5e-5
weight_decay: 0.01
min_lr: 1e-6
warmup_ratio: 0.1
grad_clip_norm: 1.0
num_epochs: 200
early_stopping_patience: 10
eval_every: 1

batch_size: 512
eval_batch_size: 512
candidate_batch_size: 512

data_dir: data-processed/umls
output_dir: output/umls-mean-context
add_inverse: true
seed: 42

save_eval_predictions: true
eval_topk: 10
eval_predictions_dir: output/umls-mean-context/predictions
