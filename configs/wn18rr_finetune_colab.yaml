# Config for GWM-RNN-Text
pretrained_model: bert-base-uncased
num_layers: 2
dynamics_layers: 2
hidden_dim: 1024
structural_dim: 384
fusion_mode: gated
dropout: 0.2
recurrent_dropout: 0.2
compgcn_layers: 1
compgcn_op: sub
loss: infonce
temperature: 0.07

learning_rate: 1e-4
text_encoder_lr: 1e-5
weight_decay: 0.01
use_scheduler: true
warmup_ratio: 0.1
max_grad_norm: 1.0
batch_size: 96
num_epochs: 200
early_stopping_patience: 5
eval_every: 1
eval_batch_size: 56
candidate_batch_size: 56
device: cuda
seed: 42
gate_alpha_min: 0.05
gate_alpha_max: 0.95

data_dir: data-processed/wn18rr
output_dir: output/wn18rr_bert_finetune
    
add_inverse: true
context_k: 5
context_algorithm: random
context_batch_size: 256
context_mmr_lambda: 0.5

max_length: 128