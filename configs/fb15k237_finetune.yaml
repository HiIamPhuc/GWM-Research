# Config for GWM dual-core finetuning (FB15k-237, BERT)
pretrained_model: bert-base-uncased
structural_dim: 1024
compgcn_layers: 1
compgcn_op: mult
dynamics_layers: 2
dropout: 0.1
recurrent_dropout: 0.1
temperature: 0.07

# LoRA finetuning for text encoder
lora_enabled: true
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: query,value

# Optimization
learning_rate: 5e-4
text_encoder_lr: 5e-5
structural_lr: 5e-5
weight_decay: 0.01
use_scheduler: true
warmup_ratio: 0.1
max_grad_norm: 1.0

# Training
num_epochs: 400
batch_size: 16
early_stopping_patience: 10
eval_every: 1
eval_batch_size: 16
candidate_batch_size: 16

# Data + output
data_dir: data-processed/fb15k-237
output_dir: output/fb15k-237
add_inverse: true

freeze_structural_priors: false

# Context
context_k: 10
context_algorithm: random
context_batch_size: 128
context_mmr_lambda: 0.5

# Text encoding
max_length: 128

# Runtime
device: cuda
seed: 42